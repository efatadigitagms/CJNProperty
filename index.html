<style>

.sigbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sigbox .pv{min-width:160px;height:64px;border:1px dashed var(--line);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#5d6a82}.sigbox .pv img{max-height:60px;max-width:220px}

@media print{body{background:#fff!important;padding:0}.shell,.toast,.noprint{display:none!important}.modal{position:static;background:none;padding:0;display:block}.rwrap{max-width:none;overflow:visible}.recibo{border-radius:0;padding:10px 0 0;font-size:12px;line-height:1.45;break-inside:avoid}.recibo header{padding-bottom:10px;margin-bottom:10px}.recibo header img{height:40px}.recibo dl{margin:10px 0;padding:8px 12px}.recibo .ass{margin-top:30px}.recibo .ass .sig{height:44px;margin:-26px 0 -12px}.recibo footer{margin-top:14px}.recibo.via2{display:block;margin-top:26px;position:relative}.recibo.via2::before{content:'';position:absolute;top:-14px;left:0;right:0;border-top:1px dashed #888}}

<script>
/* Armazenamento local (IndexedDB) com sincronização opcional com uma planilha do Google (via Apps Script).
   Expõe a mesma interface do banco usado dentro do Claude: db.collection(nome).doc(id).set/update/delete, add, onSnapshot. */
window.CJN=true;
(function(){
  const COLS=['imoveis','locadores','locatarios','contratos','pagamentos'];
  const FIELDS={
    imoveis:['codigo','endereco','bairro','tipo','aluguel','status','foto'],
    locadores:['nome','doc','pix','assinatura'],
    locatarios:['nome','cpf','telefone','email','profissao'],
    contratos:['numero','imovelId','locadorId','locatarioId','entrada','saida','valor','status','pdf'],
    pagamentos:['contratoId','referencia','valor','vencimento','dataPagamento','forma']};
  const TYPES={imoveis:{aluguel:'n'},contratos:{entrada:'d',saida:'d',valor:'n'},
    pagamentos:{valor:'n',vencimento:'d',dataPagamento:'d',referencia:'m'},locadores:{doc:'c'},locatarios:{cpf:'c'}};
  const SEED={"imoveis": {"i1": {"codigo": "101", "endereco": "Rua das Flores, 101", "bairro": "Centro", "tipo": "Residencial", "aluguel": 800, "status": "Alugado", "foto": ""}, "i2": {"codigo": "102", "endereco": "Rua das Flores, 102", "bairro": "Centro", "tipo": "Comercial", "aluguel": 1500, "status": "Alugado", "foto": ""}, "i3": {"codigo": "103", "endereco": "Avenida Brasil, 250", "bairro": "Jardim", "tipo": "Residencial", "aluguel": 1000, "status": "Disponível", "foto": ""}}, "locadores": {"l001": {"nome": "Maria Exemplo da Silva", "doc": "00000000000", "pix": "exemplo@email.com"}}, "locatarios": {"t1": {"nome": "João Exemplo de Souza", "cpf": "11111111111", "telefone": "11 90000-0000", "email": "", "profissao": "vendedor"}, "t2": {"nome": "Ana Modelo Pereira", "cpf": "22222222222", "telefone": "", "email": "", "profissao": "gerente"}}, "contratos": {"c1": {"numero": "0001", "imovelId": "i1", "locadorId": "l001", "locatarioId": "t1", "entrada": "2026-09-20", "saida": "2027-09-20", "valor": 800, "status": "Ativo", "pdf": ""}, "c2": {"numero": "0002", "imovelId": "i2", "locadorId": "l001", "locatarioId": "t2", "entrada": "2026-03-25", "saida": "2028-03-25", "valor": 1500, "status": "Ativo", "pdf": ""}}, "pagamentos": {}};

  /* ---------- conversões (a planilha pode devolver números, datas ou textos) ---------- */
  const str=v=>v==null?'':String(v).trim();
  const num=v=>{if(typeof v==='number')return v;let t=str(v).replace(/[R$\s]/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');const x=parseFloat(t);return isNaN(x)?0:x};
  const toIso=v=>{const t=str(v);if(!t)return '';let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
    m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return ''};
  const toYm=v=>{const t=str(v);let m=t.match(/^(\d{4})-(\d{2})/);if(m)return m[1]+'-'+m[2];m=t.match(/^(\d{1,2})\/(\d{4})$/);if(m)return m[2]+'-'+m[1].padStart(2,'0');return toIso(t).slice(0,7)};
  const toDoc=v=>{const t=str(v).replace(/\D/g,'');return t?(t.length<=11?t.padStart(11,'0'):t):str(v)};
  function norm(c,r){const ty=TYPES[c]||{},o={};for(const k of FIELDS[c]){const v=r[k]??'',t=ty[k];
    o[k]=t==='n'?num(v):t==='d'?toIso(v):t==='m'?toYm(v):t==='c'?toDoc(v):str(v)}return o}
  const js=o=>JSON.stringify(o,Object.keys(o).sort());
  const same=(a,b)=>a.size===b.size&&[...a].every(([k,v])=>b.has(k)&&js(b.get(k))===js(v));

  /* ---------- IndexedDB ---------- */
  const mem={},subs={};let idb=null,ready;
  COLS.forEach(c=>{mem[c]=new Map();subs[c]=new Set()});
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('cjnproperty',1);
    r.onupgradeneeded=()=>{[...COLS,'meta'].forEach(n=>r.result.createObjectStore(n))};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const done=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  const put=(c,id,d)=>{if(!idb)return Promise.resolve();const t=idb.transaction(c,'readwrite');t.objectStore(c).put(d,id);return done(t)};
  const del=(c,id)=>{if(!idb)return Promise.resolve();const t=idb.transaction(c,'readwrite');t.objectStore(c).delete(id);return done(t)};
  const loadAll=c=>new Promise((res,rej)=>{const out=new Map(),q=idb.transaction(c).objectStore(c).openCursor();
    q.onsuccess=()=>{const cur=q.result;if(cur){out.set(cur.key,cur.value);cur.continue()}else res(out)};q.onerror=()=>rej(q.error)});
  const metaGet=k=>new Promise(r=>{if(!idb)return r(undefined);const q=idb.transaction('meta').objectStore('meta').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)});
  const metaPut=(k,v)=>{if(!idb)return Promise.resolve();const t=idb.transaction('meta','readwrite');v==null?t.objectStore('meta').delete(k):t.objectStore('meta').put(v,k);return done(t)};

  /* ---------- estado da sincronização ---------- */
  let cfg=null,queue=[],state='local',lastSync=null,errMsg='',flushing=false,pulling=false;
  const hh=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const stText=()=>({local:'Dados só neste aparelho',sync:'Sincronizando…',ok:'Sincronizado'+(lastSync?' às '+hh(lastSync):''),
    pending:queue.length+' alteração(ões) para enviar',offline:'Sem conexão. Envio depois.',error:'Erro: '+errMsg})[state]||'';
  function setState(s){state=s||(!cfg?'local':queue.length?'pending':'ok');
    const el=document.querySelector('.foot .fst');if(el){el.textContent=stText();el.classList.toggle('bad',state==='error')}}
  const fail=e=>{errMsg=e.message||String(e);setState(navigator.onLine?'error':'offline')};

  const snap=c=>({docs:[...mem[c]].map(([id,d])=>({id,exists:true,data:()=>d})),size:mem[c].size,empty:!mem[c].size});
  const notify=c=>subs[c].forEach(f=>f(snap(c)));
  const rnd=()=>Math.random().toString(36).slice(2,12);

  function enqueue(op){
    if(!cfg)return;
    queue=queue.filter(o=>!(o.col===op.col&&o.id===op.id));queue.push(op);
    metaPut('queue',queue);setState();setTimeout(flush,400);
  }

  /* ---------- banco local ---------- */
  const docRef=(c,id)=>({id,
    async set(d){await ready;const n={...d};mem[c].set(id,n);await put(c,id,n);notify(c);enqueue({op:'set',col:c,id,data:n})},
    async update(d){await ready;const n={...(mem[c].get(id)||{}),...d};mem[c].set(id,n);await put(c,id,n);notify(c);enqueue({op:'set',col:c,id,data:n})},
    async delete(){await ready;mem[c].delete(id);await del(c,id);notify(c);enqueue({op:'delete',col:c,id})}});
  const colRef=c=>({doc:id=>docRef(c,id||rnd()),
    async add(d){const id=rnd();await docRef(c,id).set(d);return docRef(c,id)},
    onSnapshot(next){const f=s=>next(s);subs[c].add(f);ready.then(()=>f(snap(c)));return()=>subs[c].delete(f)}});
  const dbApi={collection:colRef,doc:p=>{const[c,id]=p.split('/');return docRef(c,id)}};
  window.claude={use:async n=>n==='db'?(await ready,dbApi):null};

  /* ---------- planilha Google (Apps Script) ---------- */
  async function call(body){
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);
    try{
      const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({token:cfg.token,...body}),redirect:'follow',signal:ctl.signal});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||'Erro na planilha');
      return j;
    }catch(e){
      if(e.name==='AbortError')throw new Error('A planilha demorou para responder');
      if(e instanceof SyntaxError)throw new Error('Resposta inválida. Na implantação, deixe o acesso como "Qualquer pessoa".');
      if(e instanceof TypeError)throw new Error('Sem conexão ou endereço incorreto');
      throw e;
    }finally{clearTimeout(t)}
  }
  async function flush(){
    if(!cfg||flushing||!queue.length)return;
    flushing=true;setState('sync');const batch=queue.slice();
    try{
      await call({action:'ops',ops:batch});
      queue=queue.filter(o=>!batch.includes(o));await metaPut('queue',queue);
      lastSync=new Date();errMsg='';setState();
    }catch(e){fail(e)}
    flushing=false;
  }
  async function pull(){
    if(!cfg||pulling||flushing||queue.length)return;
    pulling=true;setState('sync');
    try{
      const {data}=await call({action:'list'});
      const total=COLS.reduce((n,c)=>n+(data[c]||[]).length,0);
      if(!total&&COLS.some(c=>mem[c].size)){          /* planilha vazia: envia o que está no aparelho */
        COLS.forEach(c=>mem[c].forEach((d,id)=>queue.push({op:'set',col:c,id,data:d})));
        await metaPut('queue',queue);pulling=false;return flush();
      }
      for(const c of COLS){
        const nm=new Map();(data[c]||[]).forEach(r=>{const{id,...rest}=r;nm.set(String(id),norm(c,rest))});
        if(!same(mem[c],nm)){
          for(const id of [...mem[c].keys()])if(!nm.has(id))await del(c,id);
          for(const [id,d] of nm)await put(c,id,d);
          mem[c]=nm;notify(c);
        }
      }
      lastSync=new Date();errMsg='';setState();
    }catch(e){fail(e)}
    pulling=false;
  }
  const syncNow=async()=>{await flush();await pull()};

  function openCfg(){
    const layer=document.getElementById('layer');
    layer.innerHTML=`<div class="modal"><form id="cfgf"><h2>Planilha Google</h2>
      <p class="full sub">Cole o endereço do aplicativo web (termina em /exec) e o código de acesso definidos no Apps Script. Ficam guardados só neste aparelho. Ao conectar, os dados da planilha substituem os deste aparelho.</p>
      <label class="full">Endereço do aplicativo web<input id="cfgUrl" type="url" required value="${esc(cfg?.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="full">Código de acesso<input id="cfgTok" type="password" required autocomplete="off" value="${esc(cfg?.token||'')}"></label>
      <div class="acts">${cfg?'<button type="button" class="btn danger sp" id="cfgOff">Desconectar</button>':''}<button type="button" class="btn ghost" id="cfgX">Cancelar</button><button class="btn" id="cfgGo">Conectar e sincronizar</button></div></form></div>`;
    const close=()=>layer.innerHTML='';
    layer.querySelector('#cfgX').onclick=close;
    const off=layer.querySelector('#cfgOff');
    if(off)off.onclick=async()=>{cfg=null;queue=[];await metaPut('cfg',null);await metaPut('queue',null);close();setState('local');toast('Planilha desconectada')};
    layer.querySelector('#cfgf').onsubmit=async e=>{
      e.preventDefault();
      const url=layer.querySelector('#cfgUrl').value.trim(),token=layer.querySelector('#cfgTok').value;
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast('O endereço deve começar com https://script.google.com/');return}
      const btn=layer.querySelector('#cfgGo');btn.textContent='Testando…';
      const old=cfg;cfg={url,token};
      try{await call({action:'ping'});await metaPut('cfg',cfg);close();toast('Conectado');await syncNow()}
      catch(ex){cfg=old;btn.textContent='Conectar e sincronizar';toast(ex.message||'Não foi possível conectar')}
    };
  }

  /* ---------- backup em arquivo ---------- */
  async function exportar(){
    await ready;const out={versao:1,exportadoEm:new Date().toISOString()};
    COLS.forEach(c=>out[c]=Object.fromEntries(mem[c]));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download='cjnproperty-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  }
  async function importar(file){
    try{
      const j=JSON.parse(await file.text());if(!COLS.every(c=>j[c]&&typeof j[c]==='object'))throw 0;
      for(const c of COLS){
        for(const id of [...mem[c].keys()])if(!(id in j[c])){await del(c,id);enqueue({op:'delete',col:c,id})}
        mem[c]=new Map(Object.entries(j[c]));
        for(const [id,d] of mem[c]){await put(c,id,d);enqueue({op:'set',col:c,id,data:d})}
        notify(c);
      }
      toast('Backup restaurado');
    }catch(e){toast('Arquivo de backup inválido')}
  }
  function escolherBackup(){const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=()=>{if(i.files[0])importar(i.files[0])};i.click()}

  window.footHtml=()=>`<div class="foot"><div class="fst${state==='error'?' bad':''}">${esc(stText())}</div><button data-sh="cfg">Planilha Google</button><button data-sh="export">Exportar backup</button><button data-sh="import">Importar backup</button></div>`;
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-sh]');
    if(a){const k=a.dataset.sh;if(k==='cfg')openCfg();else if(k==='export')exportar();else escolherBackup();return}
    const l=e.target.closest('a[href^="data:"]');
    if(l){e.preventDefault();fetch(l.href).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'))}
  });

  /* ---------- inicialização ---------- */
  async function init(){
    try{idb=await open()}catch(e){idb=null}
    if(idb){for(const c of COLS)mem[c]=await loadAll(c);
      const seeded=await metaGet('seeded');
      if(!seeded&&COLS.every(c=>!mem[c].size)){for(const c of COLS)for(const [id,d] of Object.entries(SEED[c])){mem[c].set(id,d);await put(c,id,d)}}
      await metaPut('seeded',true);
      cfg=(await metaGet('cfg'))||null;queue=(await metaGet('queue'))||[];
    }
  }
  ready=init();
  ready.then(()=>{if(cfg){setState();syncNow()}});
  setInterval(()=>{if(cfg&&!document.hidden)syncNow()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg)syncNow()});
  window.addEventListener('online',()=>{if(cfg)syncNow()});
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>

/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const dt=s=>s?s.split('-').reverse().join('/'):'—';
const mesLabel=m=>{if(!m)return '—';const [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const by=(col,id)=>D[col].find(x=>x.id===id);
const cpf=s=>{s=String(s||'').replace(/\D/g,'');return s.length===11?s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):s};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const imLabel=i=>i?`${i.codigo||'s/n'} · ${i.endereco||''}`:'—';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function pagStatus(p){if(p.dataPagamento)return['Pago','ok'];if(p.vencimento<today())return['Atrasado','bad'];return['Pendente','warn']}

/* ---------- persistência ---------- */
async function saveDoc(col,id,obj){
  if(id) await db.collection(col).doc(id).set(obj); else await db.collection(col).add(obj);
}
async function delDoc(col,id){await db.collection(col).doc(id).delete()}

function openForm(col,id,preset){
  const S=SCHEMA[col], cur=id?by(col,id):(preset||{});
  const fields=S.campos.map(([k,l,t,x,y])=>{
    const v=cur[k]??'', cls=(x==='full'||(t==='rel'&&false))?' class="full"':'';
    let inp='';
    if(t==='select'){inp=`<select id="f_${k}">${x.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
    else if(t==='rel'){inp=`<select id="f_${k}"><option value="">Selecione…</option>${x().map(([val,lab])=>`<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`).join('')}</select>`}
    else if(t==='sig'){inp=`<input id="f_${k}" type="hidden" value="${esc(v)}"><div class="sigbox"><div class="pv" id="sigPv">${v?`<img src="${esc(v)}" alt="Assinatura">`:'Sem assinatura'}</div><div><input id="sigFile" type="file" accept="image/png,image/*"><button type="button" class="btn sm ghost" data-recact="sigdel">Remover</button></div></div><span class="sub">PNG com fundo transparente funciona melhor. Aparece nos recibos.</span>`}
    else if(t==='file'){
      if(!assets){return `<label class="full">${l} (link do Google Drive ou endereço)<input id="f_${k}" type="url" value="${esc(v)}" placeholder="https://…"></label>`}
      inp=`<input id="f_${k}" type="file" accept="${x}">${v?`<a class="link" href="${esc(v)}" target="_blank" rel="noopener">Ver arquivo atual</a>`:''}`}
    else inp=`<input id="f_${k}" type="${t}" ${t==='number'?'step="0.01" min="0"':''} value="${esc(v)}">`;
    return `<label${cls}>${l}${inp}</label>`}).join('');
  const layer=document.getElementById('layer');
  layer.innerHTML=`<div class="modal"><form id="frm"><h2>${id?'Editar':'Novo'} · ${S.titulo}</h2>${fields}
    <div class="acts">${id?'<button type="button" class="btn danger sp" id="del">Excluir</button>':''}
    <button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div>`;
  const close=()=>layer.innerHTML='';
  layer.querySelector('#cancel').onclick=close;
  layer.querySelector('.modal').addEventListener('mousedown',e=>{if(e.target.classList.contains('modal'))close()});
  const del=layer.querySelector('#del');
  if(del)del.onclick=()=>{
    del.textContent='Confirmar exclusão';del.onclick=async()=>{try{await delDoc(col,id);close();toast('Excluído')}catch(e){toast('Não foi possível excluir')}}};
  layer.querySelector('#frm').onsubmit=async e=>{
    e.preventDefault();
    const out={...cur};delete out.id;
    for(const [k,,t] of S.campos){
      const el=layer.querySelector('#f_'+k); if(!el)continue;
      if(t==='file'){if(el.type!=='file'){out[k]=el.value.trim();continue}const f=el.files[0]; if(f){try{const r=await assets.upload(f);out[k]=r.url}catch(err){toast('Falha ao enviar arquivo');return}} }
      else if(t==='number')out[k]=el.value===''?0:parseFloat(el.value);
      else out[k]=el.value.trim();
    }
    if(col==='pagamentos'&&!id&&!out.dataPagamento)out.dataPagamento='';
    try{
      if(col==='pagamentos'&&!id&&out.contratoId&&out.referencia) await db.collection(col).doc(out.contratoId+'_'+out.referencia).set(out);
      else await saveDoc(col,id,out);
      close();toast('Salvo');
    }catch(err){toast('Sem permissão para salvar')}
  };
  const first=layer.querySelector('input,select');first&&first.focus();
}

async function criarCobranca(c,mes){
  const [y,m]=mes.split('-').map(Number), ultimo=new Date(y,m,0).getDate();
  const dia=Math.min(c.entrada?+c.entrada.slice(8,10):10,ultimo);
  await db.collection('pagamentos').doc(c.id+'_'+mes).set({contratoId:c.id,referencia:mes,valor:+c.valor||0,vencimento:`${mes}-${String(dia).padStart(2,'0')}`,dataPagamento:''});
}
async function gerar(){
  const mes=pagMes==='todos'?ym(new Date()):pagMes;
  let n=0;
  for(const c of D.contratos.filter(c=>c.status==='Ativo')){
    if(c.entrada&&c.entrada.slice(0,7)>mes)continue;
    if(c.saida&&c.saida.slice(0,7)<mes)continue;
    if(D.pagamentos.some(p=>p.id===c.id+'_'+mes))continue;
    await criarCobranca(c,mes);n++;
  }
  pagMes=mes;toast(n?`${n} cobrança(s) gerada(s)`:'Nenhuma cobrança nova para este mês');
}
function mesesDoContrato(c){
  if(!c||!c.entrada)return[];
  const out=[];let [y,m]=c.entrada.slice(0,7).split('-').map(Number);
  const fim=(c.saida||c.entrada).slice(0,7);
  for(let i=0;i<600;i++){const k=y+'-'+String(m).padStart(2,'0');if(k>fim)break;out.push(k);m++;if(m>12){m=1;y++}}
  return out;
}
function mesAdd(mes,n){const [y,m]=mes.split('-').map(Number);return ym(new Date(y,m-1+n,1))}
function vCalendario(){
  const cs=[...D.contratos].sort((a,b)=>(a.status==='Ativo'?0:1)-(b.status==='Ativo'?0:1));
  if(!cs.length)return empty('Nenhum contrato','Cadastre um contrato para ver o calendário de pagamentos.');
  if(!by('contratos',calContrato))calContrato=cs[0].id;
  const c=by('contratos',calContrato), meses=mesesDoContrato(c), hoje=ym(new Date());
  const pg=mes=>D.pagamentos.find(p=>p.contratoId===c.id&&p.referencia===mes);
  const cel=mes=>{const p=pg(mes);let k='idle',t='Sem cobrança';
    if(p){[t,k]=pagStatus(p)}else if(mes>hoje)t='Futuro';
    return {p,k,t}};
  const feitos=meses.filter(m=>pg(m)?.dataPagamento).length;
  let anos='';
  for(const y of [...new Set(meses.map(m=>m.slice(0,4)))]){
    anos+=`<div class="ano">${y}</div><div class="calgrid">`+meses.filter(m=>m.startsWith(y)).map(m=>{const{p,k,t}=cel(m);
      const nome=new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
      return `<button class="mc ${k}" data-cal="${m}" aria-pressed="${m===calMes}"><b>${nome}</b><span class="mono">${brl(p?p.valor:c.valor)}</span><span class="st">${t}</span></button>`}).join('')+'</div>';
  }
  const sel=meses.includes(calMes)?calMes:null, {p:ps,t:ts}=sel?cel(sel):{};
  const det=sel?`<div class="panel det" style="margin-top:12px"><div><b>${esc(mesLabel(sel))}</b><div class="sub">${ps?`Vence ${dt(ps.vencimento)} · ${brl(ps.valor)} · ${ts}${ps.dataPagamento?' em '+dt(ps.dataPagamento):''}`:'Nenhuma cobrança gerada para este mês.'}</div></div>
    <div class="bar">${ps?`<button class="btn sm ${ps.dataPagamento?'ghost':''}" data-pay="${ps.id}">${ps.dataPagamento?'Desfazer pagamento':'Registrar pagamento'}</button>${ps.dataPagamento?`<button class="btn sm" data-rec="${ps.id}">Recibo</button>`:''}<button class="btn sm ghost" data-edit="pagamentos:${ps.id}">Editar</button>`:`<button class="btn sm" data-genone="${sel}">Gerar cobrança</button>`}</div></div>`:'';
  // calendário do mês (todos os contratos)
  const [cy,cm]=calMes.split('-').map(Number), primeiro=new Date(cy,cm-1,1).getDay(), nd=new Date(cy,cm,0).getDate();
  const ev={};
  for(const ct of D.contratos){
    const p=D.pagamentos.find(x=>x.contratoId===ct.id&&x.referencia===calMes);
    if(p){(ev[+p.vencimento.slice(8,10)]??=[]).push({ct,k:pagStatus(p)[1],v:p.valor,real:true})}
    else if(ct.status==='Ativo'&&calMes>=ct.entrada.slice(0,7)&&calMes<=(ct.saida||'9999').slice(0,7)){
      const dia=Math.min(+ct.entrada.slice(8,10),nd);(ev[dia]??=[]).push({ct,k:'',v:ct.valor,real:false})}
  }
  let cells=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="h">${d}</div>`).join('')+'<div class="dia vz"></div>'.repeat(primeiro);
  for(let d=1;d<=nd;d++){
    const ds=`${calMes}-${String(d).padStart(2,'0')}`;
    cells+=`<div class="dia ${ds===today()?'hoje':''}"><span class="n">${d}</span>${(ev[d]||[]).map(e=>`<span class="ev ${e.k}" title="${esc(by('locatarios',e.ct.locatarioId)?.nome||'')} · ${brl(e.v)}${e.real?'':' (prevista)'}">${esc((by('locatarios',e.ct.locatarioId)?.nome||'?').split(' ')[0])} ${brl(e.v).replace(/\s/g,' ')}</span>`).join('')}</div>`;
  }
  return `<div class="bar"><label>Contrato<select id="selCal">${cs.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc((by('locatarios',x.locatarioId)?.nome||'?')+' · '+imLabel(by('imoveis',x.imovelId)))}</option>`).join('')}</select></label>
    <span class="sub" style="align-self:end">${meses.length} meses · ${feitos} pago(s) · ${dt(c.entrada)} → ${dt(c.saida)}</span></div>
  <section class="panel"><h2>Meses do contrato</h2>${anos||empty('Contrato sem datas','Preencha início e término do contrato.')}${det}</section>
  <section class="panel"><div class="bar" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Vencimentos de ${esc(mesLabel(calMes))}</h2>
    <div class="bar"><button class="btn sm ghost" data-calnav="-1" aria-label="Mês anterior">‹ Anterior</button><button class="btn sm ghost" data-calnav="0">Hoje</button><button class="btn sm ghost" data-calnav="1" aria-label="Próximo mês">Próximo ›</button></div></div>
    <div class="dias">${cells}</div><p class="sub" style="margin-top:8px">Vencimentos sem cobrança gerada aparecem em cinza (previstos).</p></section>`;
}


/* ---------- recibos ---------- */
function extenso(v){
  const un=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ce=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const a999=n=>{if(n===100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(ce[c]);
    if(r){if(r<20)p.push(un[r]);else{const d=Math.floor(r/10),u=r%10;p.push(u?dz[d]+' e '+un[u]:dz[d])}}return p.join(' e ')};
  const grupo=n=>{const mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000,parts=[],vals=[];
    if(mi){parts.push(a999(mi)+(mi===1?' milhão':' milhões'));vals.push(1e6)}
    if(mil){parts.push(mil===1?'mil':a999(mil)+' mil');vals.push(1000)}
    if(r){parts.push(a999(r));vals.push(r)}
    let t=parts[0]||'';for(let i=1;i<parts.length;i++){const last=i===parts.length-1&&(vals[i]<100||vals[i]%100===0);t+=(last?' e ':', ')+parts[i]}return t};
  const total=Math.round((+v||0)*100),reais=Math.floor(total/100),cent=total%100,out=[];
  if(reais)out.push(grupo(reais)+(reais%1e6===0?' de reais':reais===1?' real':' reais'));
  if(cent)out.push(grupo(cent)+(cent===1?' centavo':' centavos'));
  return out.length?out.join(' e '):'zero real';
}
function imgSrc(u){const m=String(u||'').match(/drive\.google\.com\/file\/d\/([^/?#]+)/)||String(u||'').match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([^&#]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`:u}

function sigSet(u){const h=document.getElementById('f_assinatura'),pv=document.getElementById('sigPv');if(h)h.value=u||'';if(pv)pv.innerHTML=u?`<img src="${u}" alt="Assinatura">`:'Sem assinatura'}
async function sigLoad(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  try{
    const url=URL.createObjectURL(f),img=new Image();img.src=url;await img.decode();
    let w=img.naturalWidth,h=img.naturalHeight;
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    cv.width=w;cv.height=h;cx.drawImage(img,0,0);URL.revokeObjectURL(url);
    let d=cx.getImageData(0,0,w,h),a=d.data,opaque=true;
    for(let i=3;i<a.length;i+=4)if(a[i]<250){opaque=false;break}
    if(opaque)for(let i=0;i<a.length;i+=4)if(a[i]>235&&a[i+1]>235&&a[i+2]>235)a[i+3]=0;
    let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(a[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<0){toast('A imagem não tem assinatura visível');inp.value='';return}
    cx.putImageData(d,0,0);
    const cw=x1-x0+1,ch=y1-y0+1;
    let sc=Math.min(1,360/cw,140/ch),out='';
    for(let k=0;k<8;k++){
      const c2=document.createElement('canvas');c2.width=Math.max(1,Math.round(cw*sc));c2.height=Math.max(1,Math.round(ch*sc));
      c2.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,c2.width,c2.height);
      out=c2.toDataURL('image/png');if(out.length<=42000)break;sc*=.75;
    }
    if(out.length>42000){toast('Imagem muito detalhada. Use uma assinatura mais simples.');inp.value='';return}
    sigSet(out);toast('Assinatura carregada. Clique em Salvar.');
  }catch(err){toast('Não foi possível ler a imagem')}
}

async function reciboPdf(p){
  const {im,lt,ld,num}=reciboInfo(p),v=+p.valor||0;
  const img=new Image();img.src=LOGO;await img.decode();
  const iw=img.naturalWidth,ih=img.naturalHeight,cv=document.createElement('canvas');cv.width=iw;cv.height=ih;
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,iw,ih);cx.drawImage(img,0,0);
  const jb=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]);
  const W=595.28,H=841.89,M=56,meas=document.createElement('canvas').getContext('2d');
  const enc=t=>String(t==null?'':t).replace(/[—–]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x00-\xFF]/g,'?').replace(/([\\()])/g,'\\$1');
  const FONT={F1:'Helvetica, Arial, sans-serif',F2:'bold Helvetica, Arial, sans-serif'};
  const wid=(t,f,sz)=>{if(f==='F3'||f==='F4')return String(t).length*.6*sz;meas.font=(f==='F2'?'bold ':'')+sz+'px Helvetica, Arial, sans-serif';return meas.measureText(String(t)).width};
  const n2=x=>x.toFixed(2),col=(r,g,b)=>`${n2(r)} ${n2(g)} ${n2(b)}`;
  const BLUE=col(.016,.235,.584),INK=col(.08,.1,.17),GRAY=col(.36,.42,.51);
  let c='';
  const text=(x,top,t,f,sz,color,al)=>{const w=wid(t,f,sz);if(al==='r')x-=w;else if(al==='c')x-=w/2;
    c+=`BT /${f} ${sz} Tf ${color} rg ${n2(x)} ${n2(H-top)} Td (${enc(t)}) Tj ET\n`};
  const wrap=(t,f,sz,max)=>{const words=String(t).split(' '),lines=[];let cur='';
    for(const w of words){const x=cur?cur+' '+w:w;if(wid(x,f,sz)>max&&cur){lines.push(cur);cur=w}else cur=x}if(cur)lines.push(cur);return lines};
  let sg=null;
  if(ld?.assinatura){try{const si=new Image();si.src=ld.assinatura;await si.decode();
    const sw=si.naturalWidth,sh=si.naturalHeight,sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
    const sx=sc.getContext('2d');sx.fillStyle='#fff';sx.fillRect(0,0,sw,sh);sx.drawImage(si,0,0);
    sg={w:sw,h:sh,jb:atob(sc.toDataURL('image/jpeg',.92).split(',')[1])}}catch(err){sg=null}}
  const lh=40,lw=lh*iw/ih,M2=48,CW=W-2*M2;
  const via=(t0,lbl)=>{
    c+=`${BLUE} rg 0 ${n2(H-t0-5)} ${n2(W)} 5 re f\n`;
    c+=`q ${n2(lw)} 0 0 ${lh} ${M2} ${n2(H-t0-22-lh)} cm /Im1 Do Q\n`;
    text(M2+lw+14,t0+40,'RECIBO DE ALUGUEL','F2',15,BLUE);
    text(M2+lw+14,t0+54,'Nº '+num,'F3',8,GRAY);
    text(W-M2,t0+46,brl(v),'F4',15,BLUE,'r');
    c+=`0.5 w ${col(.85,.87,.92)} RG ${M2} ${n2(H-t0-72)} m ${n2(W-M2)} ${n2(H-t0-72)} l S\n`;
    const par=`Recebi de ${lt?.nome||'—'}${lt?.cpf?', CPF '+cpf(lt.cpf):''}, a importância de ${brl(v)} (${extenso(v)}), referente ao aluguel do mês de ${mesLabel(p.referencia)} do imóvel situado em ${im?.endereco||'—'}${im?.bairro?', bairro '+im.bairro:''}.`;
    let y=t0+96;
    for(const l of wrap(par,'F1',10.5,CW-12)){text(M2,y,l,'F1',10.5,INK);y+=15}
    y+=4;
    c+=`${col(.945,.957,.98)} rg ${M2} ${n2(H-y-40)} ${n2(CW)} 40 re f\n`;
    const cw=CW/3;
    [['VENCIMENTO',dt(p.vencimento)],['DATA DO PAGAMENTO',dt(p.dataPagamento)],['FORMA DE PAGAMENTO',p.forma||'-']].forEach(([a,b],k)=>{
      text(M2+12+k*cw,y+14,a,'F1',7.5,GRAY);text(M2+12+k*cw,y+30,b,'F3',10,INK)});
    y+=40+22;
    text(M2,y,'Dou plena e geral quitação do valor acima.','F1',10.5,INK);
    y+=58;
    if(sg){const gh=40,gw=Math.min(170,gh*sg.w/sg.h),gh2=gw*sg.h/sg.w;c+=`q ${n2(gw)} 0 0 ${n2(gh2)} ${n2(W/2-gw/2)} ${n2(H-y+3)} cm /Im2 Do Q\n`}
    c+=`0.8 w ${INK} RG ${n2(W/2-120)} ${n2(H-y)} m ${n2(W/2+120)} ${n2(H-y)} l S\n`;
    text(W/2,y+13,ld?.nome||'Locador','F2',11,INK,'c');
    const sub=[ld?.doc?'CPF/CNPJ '+cpf(ld.doc):'',ld?.pix?'Pix: '+ld.pix:''].filter(Boolean).join('  -  ');
    if(sub)text(W/2,y+26,sub,'F1',8.5,GRAY,'c');
    text(W/2,t0+H/2-18,'CJNProperty - emitido em '+dt(today())+' - '+lbl,'F1',7.5,GRAY,'c');
  };
  via(0,'1ª via');
  c+=`0.6 w [4 3] 0 d ${col(.6,.62,.68)} RG ${M2} ${n2(H/2)} m ${n2(W-M2)} ${n2(H/2)} l S [] 0 d\n`;
  via(H/2+6,'2ª via');
  const o=[];
  o[1]='<< /Type /Catalog /Pages 2 0 R >>';
  o[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  o[3]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R /F4 8 0 R >> /XObject << /Im1 9 0 R${sg?' /Im2 10 0 R':''} >> >> /Contents 4 0 R >>`;
  o[4]=`<< /Length ${c.length} >>\nstream\n${c}endstream`;
  ['Helvetica','Helvetica-Bold','Courier','Courier-Bold'].forEach((f,i)=>{o[5+i]=`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`});
  o[9]=`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>\nstream\n${jb}\nendstream`;
  if(sg)o[10]=`<< /Type /XObject /Subtype /Image /Width ${sg.w} /Height ${sg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${sg.jb.length} >>\nstream\n${sg.jb}\nendstream`;
  const NO=sg?10:9;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];
  for(let i=1;i<=NO;i++){off[i]=out.length;out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
  const xr=out.length;
  out+=`xref\n0 ${NO+1}\n`+'0000000000 65535 f \n'+off.slice(1).map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${NO+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
async function baixarPdf(p){
  try{
    const bytes=await reciboPdf(p),{lt,num}=reciboInfo(p);
    const nome=('Recibo-'+num+'-'+(lt?.nome||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-')).replace(/-+$/,'')+'.pdf';
    const blob=new Blob([bytes],{type:'application/pdf'});
    if(!window.CJN&&window.claude){try{const d=await claude.use('downloads');if(d){await d.save({filename:nome,data:blob});toast('PDF salvo');return}}catch(e){if(e&&e.code==='declined')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PDF gerado');
  }catch(e){toast('Não foi possível gerar o PDF')}
}

  if(e.target.id==='selRec'){recMes=e.target.value;render()}
  if(e.target.id==='recData'&&RECIBO){const v=e.target.value;if(!v){toast('Informe a data do pagamento');RECIBO.draw();return}RECIBO.p.dataPagamento=v;db.collection('pagamentos').doc(RECIBO.id).update({dataPagamento:v}).catch(()=>toast('Sem permissão para salvar'));RECIBO.draw()}
  if(e.target.id==='recForma'&&RECIBO){RECIBO.p.forma=e.target.value;db.collection('pagamentos').doc(RECIBO.id).update({forma:e.target.value}).catch(()=>toast('Sem permissão para salvar'));RECIBO.draw()}
  if(e.target.id==='selCal'){calContrato=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-edit],[data-rec]'))e.target.click(); if(e.key==='Escape')document.getElementById('layer').innerHTML=''});

render();
(async()=>{
  try{ if(window.claude) {db=await claude.use('db'); assets=await claude.use('assets');} }catch(e){}
  render();
  if(!db)return;
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
})();
</script>
